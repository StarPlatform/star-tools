document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSidebar(); });

function save(id, data){
  if (todoRef) return todoRef.child(id).set(data);
  todos[id] = data; localStorage.setItem(LS_KEY, JSON.stringify(todos)); render();
}
function remove(id){
  if (todoRef) return todoRef.child(id).remove();
  delete todos[id]; localStorage.setItem(LS_KEY, JSON.stringify(todos)); render();
}

firebase.auth().onAuthStateChanged(function(user){
  if (user) {
    todoRef = db.ref('users/' + user.uid + '/todos');
    todoRef.on('value', s => { skLoaded = true; todos = s.val() || {}; render(); });
  } else if (localStorage.getItem('isGuest') === 'true') {
    try { todos = JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch(e){ todos = {}; }
    skLoaded = true;
    render();
  } else {
    window.location.href = 'login.html';
  }
});

// ===== Tenggat: helper tanggal (lokal) =====
function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function todayKey(){ const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function parseKey(k){ const p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function dayDiff(a, b){ return Math.round((parseKey(b) - parseKey(a)) / 86400000); }
function tglPendek(k){ return parseKey(k).toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' }); }
function dueChip(t){
  if (!t.due || t.done) return '';
  const d = dayDiff(todayKey(), t.due), jam = t.jam ? ' · ' + t.jam : '';
  let cls = '', txt = '';
  if (d < 0) { cls = 'late'; txt = 'Terlambat ' + (-d) + ' hari'; }
  else if (d === 0) { cls = 'today'; txt = 'Hari ini' + jam; }
  else if (d === 1) { cls = 'soon'; txt = 'Besok' + jam; }
  else { txt = tglPendek(t.due) + jam; }
  return '<span class="due ' + cls + '">' + txt + '</span>';
}
function urutTodo(a, b){
  if (a.done !== b.done) return a.done - b.done;
  if (a.due && b.due) {
    const ka = a.due + (a.jam || '23:59'), kb = b.due + (b.jam || '23:59');
    if (ka !== kb) return ka < kb ? -1 : 1;
  } else if (a.due || b.due) {
    return a.due ? -1 : 1;
  }
  return b.createdAt - a.createdAt;
}

function addTodo(){
  const title = inTitle.value.trim();
  if (!title) return;
  const due = /^\d{4}-\d{2}-\d{2}$/.test(inDue.value) ? inDue.value : '';
  const jam = due && /^\d{2}:\d{2}$/.test(inTime.value) ? inTime.value : '';
  const id = todoRef ? todoRef.push().key : 't' + Date.now();
  const data = { title, done:false, createdAt:Date.now() };
  if (due) data.due = due;
  if (jam) data.jam = jam;
  save(id, data);
  inTitle.value = ''; inDue.value = ''; inTime.value = '';
  inTitle.focus();
}
inTitle.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });

function toggleDone(id){ const t = todos[id]; if (t) save(id, Object.assign({}, t, { done:!t.done })); }

function esc(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

let filter = 'semua';
function setFilter(f){
  filter = f;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.f === f));
  render();
}

function clearDone(){
  const ids = Object.keys(todos).filter(id => todos[id].done);
  if (!ids.length || !confirm('Hapus ' + ids.length + ' tugas yang sudah selesai?')) return;
  if (todoRef) {
    const upd = {}; ids.forEach(id => upd[id] = null);
    todoRef.update(upd);
  } else {
    ids.forEach(id => delete todos[id]);
    localStorage.setItem(LS_KEY, JSON.stringify(todos)); render();
  }
}

heroDate.textContent = new Date().toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

var skLoaded = false;
// Skeleton shimmer: lepas penanda loading saat data siap (+ pengaman 8 detik)
function skDone() { document.querySelectorAll('.sk-pending').forEach(function (el) { el.classList.remove('sk-pending'); el.classList.add('sk-reveal'); }); setTimeout(function () { document.querySelectorAll('.sk-first').forEach(function (el) { el.classList.remove('sk-first'); }); }, 1500); }
setTimeout(skDone, 8000);
function skRowsHtml(n) { var h = ''; for (var i = 0; i < (n || 3); i++) h += '<span class="sk-block sk-row"></span>'; return h; }
function skTableHtml(rows, cols) {
  rows = rows || 6; cols = cols || 4;
  var h = '<div class="sk-table" aria-busy="true" aria-label="Memuat data">';
  for (var r = 0; r <= rows; r++) {
    h += '<div class="sk-line' + (r === 0 ? ' sk-head' : '') + '"><span class="sk-block sk-name"></span>';
    for (var c = 0; c < cols; c++) h += '<span class="sk-block"></span>';
    h += '</div>';
  }
  return h + '</div>';
}
setTimeout(function () { if (!skLoaded) { skLoaded = true; render(); } }, 8000);

function render(){
  if (!skLoaded) return;
  skDone();
  const all = Object.keys(todos).map(id => Object.assign({ id }, todos[id]));
  const total = all.length, done = all.filter(t => t.done).length;

  const hariIni = todayKey();
  const telat = all.filter(t => !t.done && t.due && dayDiff(hariIni, t.due) < 0).length;
  heroSub.textContent = (!total ? 'Belum ada tugas' :
    (done === total ? 'Semua tugas selesai, mantap!' : done + ' dari ' + total + ' tugas selesai')) + (telat ? ' · ' + telat + ' terlambat' : '');
  progressBar.style.width = (total ? Math.round(done / total * 100) : 0) + '%';
  btnClear.style.display = done ? 'block' : 'none';

  const items = all
    .filter(t => filter === 'semua' || (filter === 'selesai' ? t.done : !t.done))
    .sort(urutTodo);

  if (!items.length) {
    list.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><br>' +
      (total ? 'Tidak ada tugas di sini' : 'Belum ada tugas. Tulis yang pertama di atas ya!') + '</div>';
    return;
  }
  list.innerHTML = items.map(t =>
    '<div class="todo' + (t.done ? ' done' : '') + '">' +
    '<button class="check" onclick="toggleDone(\'' + t.id + '\')" aria-label="Selesai"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>' +
    '<div class="todo-main"><span class="todo-title">' + esc(t.title) + '</span>' + dueChip(t) + '</div>' +
    '<button class="del" onclick="remove(\'' + t.id + '\')" aria-label="Hapus"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>' +
    '</div>').join('');
}
render();
</script>
<script src="telepon.js"></script>
