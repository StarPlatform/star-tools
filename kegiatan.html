<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>STools - Daftar Tugas</title>
<link rel="icon" type="image/png" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; background:#F1F5F9; color:#0F172A; }
body.dark { background:#0B1120; color:#F1F5F9; }
.app-container { max-width:560px; margin:0 auto; min-height:100vh; }

.app-header { background:#fff; padding:16px 20px; display:flex; align-items:center; gap:12px; border-bottom:1px solid #E2E8F0; position:sticky; top:0; z-index:20; }
body.dark .app-header { background:#111827; border-bottom-color:#1E293B; }
.menu-icon { width:40px; height:40px; background:#F8FAFE; border-radius:32px; display:flex; align-items:center; justify-content:center; cursor:pointer; border:1px solid #E2E8F0; }
body.dark .menu-icon { background:#1E293B; border-color:#334155; }
.menu-icon svg { stroke:#0F172A; } body.dark .menu-icon svg { stroke:#F1F5F9; }
.app-title { font-weight:700; font-size:20px; letter-spacing:-.3px; background:linear-gradient(135deg,#2563EB,#60A5FA); -webkit-background-clip:text; background-clip:text; color:transparent; }

.sidebar-overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:100; opacity:0; visibility:hidden; transition:.3s; }
.sidebar-overlay.active { opacity:1; visibility:visible; }
.sidebar-nav { position:fixed; top:0; left:-280px; width:280px; height:100%; background:#fff; z-index:101; transition:.3s cubic-bezier(.2,.9,.4,1.1); padding:70px 20px 30px; display:flex; flex-direction:column; gap:4px; box-shadow:4px 0 20px rgba(0,0,0,.1); }
.sidebar-nav.active { left:0; }
body.dark .sidebar-nav { background:#111827; }
.sidebar-nav a { padding:14px 18px; font-size:16px; font-weight:500; border-radius:18px; text-decoration:none; color:#0F172A; display:flex; align-items:center; gap:14px; }
body.dark .sidebar-nav a { color:#F1F5F9; }
.sidebar-nav a:active { background:#DBEAFE; } body.dark .sidebar-nav a:active { background:#1E293B; }
.sidebar-nav a.active-link { background:#DBEAFE; color:#2563EB; }
body.dark .sidebar-nav a.active-link { background:#1E3A8A; color:#93C5FD; }
.close-sidebar-icon { position:absolute; top:20px; right:20px; cursor:pointer; width:40px; height:40px; display:flex; align-items:center; justify-content:center; }
.close-sidebar-icon svg { stroke:#0F172A; } body.dark .close-sidebar-icon svg { stroke:#F1F5F9; }

.content { padding:16px; display:flex; flex-direction:column; gap:14px; }

/* KARTU ATAS: sapaan + progres + input */
.hero { background:linear-gradient(135deg,#2563EB,#1D4ED8); color:#fff; border-radius:24px; padding:20px; }
.hero-date { font-size:13px; opacity:.85; }
.hero-title { font-size:22px; font-weight:700; margin-top:2px; letter-spacing:-.3px; }
.hero-sub { font-size:13px; opacity:.9; margin-top:4px; }
.progress { height:8px; background:rgba(255,255,255,.25); border-radius:99px; overflow:hidden; margin:14px 0 16px; }
.progress > div { height:100%; width:0; background:#fff; border-radius:99px; transition:.4s; }
.add { display:flex; gap:10px; }
.add input { flex:1; min-width:0; padding:13px 16px; border:none; border-radius:16px; font-size:15px; font-family:inherit; background:#fff; color:#0F172A; outline:none; }
.add button { width:48px; border:none; border-radius:16px; background:rgba(255,255,255,.22); color:#fff; font-size:26px; cursor:pointer; }
.add button:active { transform:scale(.94); }

/* KARTU DAFTAR: satu wadah, item dipisah garis */
.card { background:#fff; border:1px solid #E2E8F0; border-radius:24px; padding:8px 18px 12px; }
body.dark .card { background:#111827; border-color:#1E293B; }
.tabs { display:flex; gap:6px; padding:10px 0 6px; }
.tab { padding:7px 14px; border-radius:99px; border:none; background:transparent; font-size:13px; font-weight:600; color:#64748B; cursor:pointer; font-family:inherit; }
body.dark .tab { color:#94A3B8; }
.tab.active { background:#DBEAFE; color:#2563EB; }
body.dark .tab.active { background:#1E3A8A; color:#93C5FD; }

.todo { display:flex; align-items:center; gap:12px; padding:14px 0; border-top:1px solid #F1F5F9; }
body.dark .todo { border-top-color:#1E293B; }
.check { width:24px; height:24px; border-radius:50%; border:2px solid #CBD5E1; background:transparent; flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
.check svg { width:14px; height:14px; stroke:#fff; opacity:0; }
.todo.done .check { background:#2563EB; border-color:#2563EB; }
.todo.done .check svg { opacity:1; }
.todo-title { flex:1; min-width:0; font-size:15px; word-break:break-word; }
.todo.done .todo-title { text-decoration:line-through; color:#94A3B8; }
.del { width:32px; height:32px; border:none; background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.del svg { width:18px; height:18px; stroke:#CBD5E1; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.del:active svg { stroke:#DC2626; }

.empty { text-align:center; padding:36px 16px 28px; color:#94A3B8; font-size:14px; border-top:1px solid #F1F5F9; }
body.dark .empty { border-top-color:#1E293B; }
.empty svg { width:44px; height:44px; stroke:#CBD5E1; margin-bottom:8px; }
.clear { display:block; margin:6px auto 0; background:none; border:none; color:#64748B; font-size:13px; font-family:inherit; cursor:pointer; padding:8px; }

.sidebar-brand { display:none; }

/* ===== DESKTOP: aplikasi penuh dengan sidebar tetap ===== */
@media (min-width: 900px) {
  body { background:#F8FAFC; }
  body.dark { background:#0B1120; }

  .sidebar-overlay { display:none !important; }
  .close-sidebar-icon, .menu-icon { display:none !important; }
  .sidebar-nav {
    left:0; width:240px; padding:24px 14px 20px; gap:2px;
    box-shadow:none; border-right:1px solid #E2E8F0; transition:none; z-index:30; overflow-y:auto;
  }
  body.dark .sidebar-nav { border-right-color:#1E293B; }
  .sidebar-brand {
    display:block; padding:2px 16px 22px; font-size:22px; font-weight:700; letter-spacing:-.3px;
    background:linear-gradient(135deg,#2563EB,#60A5FA); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sidebar-nav a { padding:12px 16px; font-size:14.5px; border-radius:12px; }
  .sidebar-nav a:hover { background:#F1F5F9; }
  body.dark .sidebar-nav a:hover { background:#16203A; }
  .sidebar-nav a.active-link:hover { background:#DBEAFE; }
  body.dark .sidebar-nav a.active-link:hover { background:#1E3A8A; }

  .app-container { max-width:none; width:auto; margin:0 0 0 240px; min-height:100vh; }
  .app-header {
    min-height:68px; background:rgba(248,250,252,.88); backdrop-filter:blur(10px);
    padding:0 max(32px, calc((100% - 1100px) / 2 + 32px));
  }
  body.dark .app-header { background:rgba(11,17,32,.88); }
  .app-title { font-size:22px; }

  /* kiri: ringkasan + input, kanan: daftar */
  .content {
    width:100%; max-width:1100px; margin:0 auto; padding:28px 32px 48px;
    display:grid; grid-template-columns:minmax(0,380px) minmax(0,1fr); gap:24px; align-items:start;
  }
  .hero { position:sticky; top:92px; padding:28px; border-radius:24px; }
  .hero-title { font-size:28px; margin-top:4px; }
  .hero-sub { font-size:14px; }
  .progress { height:10px; margin:18px 0 22px; }
  .add input { padding:15px 18px; font-size:15px; }
  .add button { width:52px; transition:background .15s; }
  .add button:hover { background:rgba(255,255,255,.34); }

  .card { padding:12px 28px 20px; min-height:380px; border-radius:24px; }
  .tabs { padding:14px 0 8px; gap:8px; }
  .tab { padding:8px 18px; font-size:13.5px; transition:background .15s; }
  .tab:not(.active):hover { background:#F1F5F9; }
  body.dark .tab:not(.active):hover { background:#1E293B; }
  .todo { padding:16px 0; }
  .todo-title { font-size:15.5px; }
  .todo:hover .del svg { stroke:#94A3B8; }
  .del:hover svg { stroke:#DC2626 !important; }
  .check { transition:border-color .15s; }
  .check:hover { border-color:#2563EB; }
  .empty { padding:72px 16px 56px; }
  .clear:hover { color:#DC2626; }
}

@media (min-width: 900px) and (max-width: 1099px) {
  .content { grid-template-columns:minmax(0,320px) minmax(0,1fr); padding:24px; gap:20px; }
}
</style>
</head>
<body>
<div class="app-container">

  <div class="app-header">
    <div class="menu-icon" onclick="openSidebar()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </div>
    <span class="app-title">Daftar Tugas</span>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <div class="sidebar-nav" id="sidebarNav">
    <div class="close-sidebar-icon" onclick="closeSidebar()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </div>
    <div class="sidebar-brand">STools</div>
    <a href="index.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> Utama
    </a>
    <a href="berita.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="12" y2="16"/></svg> Berita
    </a>
    <a href="premium.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> Premium
    </a>
    <a href="akun.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Akun
    </a>
    <a href="kegiatan.html" class="active-link">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg> Daftar Tugas
    </a>
    <a href="teman.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> Teman
    </a>
    <a href="lokasi.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> Lokasi
    </a>
  </div>

  <div class="content">

    <div class="hero">
      <div class="hero-date" id="heroDate"></div>
      <div class="hero-title">Tugas Kamu</div>
      <div class="hero-sub" id="heroSub">Belum ada tugas</div>
      <div class="progress"><div id="progressBar"></div></div>
      <div class="add">
        <input type="text" id="inTitle" placeholder="Mau ngerjain apa hari ini?" maxlength="120">
        <button onclick="addTodo()" aria-label="Tambah">+</button>
      </div>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab active" data-f="semua" onclick="setFilter('semua')">Semua</button>
        <button class="tab" data-f="aktif" onclick="setFilter('aktif')">Belum</button>
        <button class="tab" data-f="selesai" onclick="setFilter('selesai')">Selesai</button>
      </div>
      <div id="list"></div>
      <button class="clear" id="btnClear" onclick="clearDone()" style="display:none">Hapus yang sudah selesai</button>
    </div>

  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDgr_nHqvpMsiG4lBkYckzxRErkskXj_6E",
  authDomain: "laporanstartools-c18b2.firebaseapp.com",
  databaseURL: "https://laporanstartools-c18b2-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "laporanstartools-c18b2",
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();

if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');

let todos = {};
let todoRef = null; // null = mode tamu (localStorage)
const LS_KEY = 'stools_todos_guest';

function openSidebar(){ sidebarOverlay.classList.add('active'); sidebarNav.classList.add('active'); }
function closeSidebar(){ sidebarOverlay.classList.remove('active'); sidebarNav.classList.remove('active'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSidebar(); });

function save(id, data){
  if (todoRef) return todoRef.child(id).set(data);
  todos[id] = data; localStorage.setItem(LS_KEY, JSON.stringify(todos)); render();
}
function remove(id){
  if (todoRef) return todoRef.child(id).remove();
  delete todos[id]; localStorage.setItem(LS_KEY, JSON.stringify(todos)); render();
}

firebase.auth().onAuthStateChanged(function(user){
  if (user) {
    todoRef = db.ref('users/' + user.uid + '/todos');
    todoRef.on('value', s => { todos = s.val() || {}; render(); });
  } else if (localStorage.getItem('isGuest') === 'true') {
    try { todos = JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch(e){ todos = {}; }
    render();
  } else {
    window.location.href = 'login.html';
  }
});

function addTodo(){
  const title = inTitle.value.trim();
  if (!title) return;
  const id = todoRef ? todoRef.push().key : 't' + Date.now();
  save(id, { title, done:false, createdAt:Date.now() });
  inTitle.value = '';
  inTitle.focus();
}
inTitle.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });

function toggleDone(id){ const t = todos[id]; if (t) save(id, Object.assign({}, t, { done:!t.done })); }

function esc(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

let filter = 'semua';
function setFilter(f){
  filter = f;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.f === f));
  render();
}

function clearDone(){
  const ids = Object.keys(todos).filter(id => todos[id].done);
  if (!ids.length || !confirm('Hapus ' + ids.length + ' tugas yang sudah selesai?')) return;
  if (todoRef) {
    const upd = {}; ids.forEach(id => upd[id] = null);
    todoRef.update(upd);
  } else {
    ids.forEach(id => delete todos[id]);
    localStorage.setItem(LS_KEY, JSON.stringify(todos)); render();
  }
}

heroDate.textContent = new Date().toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

function render(){
  const all = Object.keys(todos).map(id => Object.assign({ id }, todos[id]));
  const total = all.length, done = all.filter(t => t.done).length;

  heroSub.textContent = !total ? 'Belum ada tugas' :
    (done === total ? 'Semua tugas selesai, mantap!' : done + ' dari ' + total + ' tugas selesai');
  progressBar.style.width = (total ? Math.round(done / total * 100) : 0) + '%';
  btnClear.style.display = done ? 'block' : 'none';

  const items = all
    .filter(t => filter === 'semua' || (filter === 'selesai' ? t.done : !t.done))
    .sort((a, b) => (a.done - b.done) || (b.createdAt - a.createdAt));

  if (!items.length) {
    list.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><br>' +
      (total ? 'Tidak ada tugas di sini' : 'Belum ada tugas. Tulis yang pertama di atas ya!') + '</div>';
    return;
  }
  list.innerHTML = items.map(t =>
    '<div class="todo' + (t.done ? ' done' : '') + '">' +
    '<button class="check" onclick="toggleDone(\'' + t.id + '\')" aria-label="Selesai"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>' +
    '<span class="todo-title">' + esc(t.title) + '</span>' +
    '<button class="del" onclick="remove(\'' + t.id + '\')" aria-label="Hapus"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>' +
    '</div>').join('');
}
render();
</script>
</body>
</html>
