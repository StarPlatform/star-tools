function letakUnsur(z) {
  if (z === 1) return { periode: 1, golongan: 1, baris: 1, kolom: 1 };
  if (z === 2) return { periode: 1, golongan: 18, baris: 1, kolom: 18 };
  if (z >= 57 && z <= 71) return { periode: 6, golongan: null, baris: 9, kolom: z - 54 };
  if (z >= 89 && z <= 103) return { periode: 7, golongan: null, baris: 10, kolom: z - 86 };
  let periode = 0;
  let golongan = 0;
  if (z <= 4) { periode = 2; golongan = z - 2; }
  else if (z <= 10) { periode = 2; golongan = z + 8; }
  else if (z <= 12) { periode = 3; golongan = z - 10; }
  else if (z <= 18) { periode = 3; golongan = z; }
  else if (z <= 36) { periode = 4; golongan = z - 18; }
  else if (z <= 54) { periode = 5; golongan = z - 36; }
  else if (z <= 56) { periode = 6; golongan = z - 54; }
  else if (z <= 86) { periode = 6; golongan = z - 68; }
  else if (z <= 88) { periode = 7; golongan = z - 86; }
  else { periode = 7; golongan = z - 100; }
  return { periode: periode, golongan: golongan, baris: periode, kolom: golongan };
}

const $ = function(id) { return document.getElementById(id); };
let mode = 'kategori';
let fokus = '';
let kata = '';
let suhu = 25;
let ukuran = 40;
let terpilih = 0;
const sel = {};

function esc(t) {
  return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function angkaId(n) {
  return Number(n).toLocaleString('id-ID');
}

function modeGelap() {
  return document.body.classList.contains('dark');
}

function wujudPada(e, t) {
  if (e.wujud === 'u') return 'u';
  if (e.leleh == null) return e.wujud;
  if (e.didih != null && e.didih < e.leleh) return t < e.didih ? 's' : 'g';
  if (t < e.leleh) return 's';
  if (e.didih == null) return 'c';
  return t < e.didih ? 'c' : 'g';
}

function kelasWarna(e) {
  if (mode === 'kategori') return 'k-' + e.kat;
  if (mode === 'wujud') return 'w-' + wujudPada(e, suhu);
  return 'w-u';
}

function kunciFokus(e) {
  if (mode === 'kategori') return e.kat;
  if (mode === 'wujud') return wujudPada(e, suhu);
  return '';
}

function bangunTabel() {
  const tabel = $('tabel');
  tabel.innerHTML = '';
  const tambahPenanda = function(baris, kolom, teks) {
    const d = document.createElement('div');
    d.className = 'penanda warna k-' + (baris === 6 ? 'l' : 'k');
    d.style.gridRow = baris;
    d.style.gridColumn = kolom;
    d.textContent = teks;
    tabel.appendChild(d);
  };
  tambahPenanda(6, 3, '57–71');
  tambahPenanda(7, 3, '89–103');
  const labelSeri = function(baris, teks) {
    const d = document.createElement('div');
    d.className = 'label-seri';
    d.style.gridRow = baris;
    d.textContent = teks;
    tabel.appendChild(d);
  };
  labelSeri(9, 'Lantanida');
  labelSeri(10, 'Aktinida');
  DATA.forEach(function(e) {
    const b = document.createElement('button');
    b.className = 'sel warna';
    b.style.gridRow = e.baris;
    b.style.gridColumn = e.kolom;
    b.setAttribute('aria-label', e.nama + ', nomor atom ' + e.z);
    b.innerHTML = '<span class="no">' + e.z + '</span><span class="sim">' + esc(e.sim) + '</span><span class="nm">' + esc(e.nama) + '</span>';
    b.addEventListener('click', function() { bukaDetail(e.z); });
    tabel.appendChild(b);
    sel[e.z] = b;
  });
  const spasi = document.createElement('div');
  spasi.className = 'jarak';
  spasi.style.gridRow = 8;
  spasi.style.gridColumn = 1;
  tabel.appendChild(spasi);
}

function warnaEn(e) {
  if (e.en == null) return null;
  const t = Math.min(1, Math.max(0, (e.en - 0.7) / 3.3));
  if (modeGelap()) return { bg: 'hsl(215,85%,' + (18 + t * 40) + '%)', fg: '#fff' };
  return { bg: 'hsl(215,85%,' + (94 - t * 44) + '%)', fg: t > 0.5 ? '#fff' : '#1E3A8A' };
}

function sudahCocok(e) {
  if (!kata) return true;
  const k = kata.toLowerCase();
  return e.nama.toLowerCase().indexOf(k) !== -1 || e.sim.toLowerCase() === k || e.sim.toLowerCase().indexOf(k) === 0 || String(e.z) === k;
}

function segarkan() {
  DATA.forEach(function(e) {
    const b = sel[e.z];
    b.className = 'sel warna ' + kelasWarna(e);
    b.style.background = '';
    b.style.color = '';
    if (mode === 'en') {
      const w = warnaEn(e);
      if (w) { b.className = 'sel'; b.style.background = w.bg; b.style.color = w.fg; }
      else b.className = 'sel warna w-u';
    }
    const cocokFokus = !fokus || kunciFokus(e) === fokus;
    const cocokKata = sudahCocok(e);
    if (!cocokFokus || !cocokKata) b.classList.add('redup');
    if (kata && cocokKata) b.classList.add('cocok');
  });
  segarkanLegenda();
}

function segarkanLegenda() {
  const wadah = $('legenda');
  wadah.innerHTML = '';
  if (mode === 'en') {
    wadah.innerHTML = '<div><div class="skala"></div><div class="skala-teks"><span>Rendah (0,7)</span><span>Tinggi (3,98)</span></div></div>';
    return;
  }
  const daftar = mode === 'kategori'
    ? Object.keys(KATEGORI).map(function(k) { return { kunci: k, nama: KATEGORI[k], kelas: 'k-' + k }; })
    : ['s', 'c', 'g', 'u'].map(function(k) { return { kunci: k, nama: WUJUD[k], kelas: 'w-' + k }; });
  daftar.forEach(function(d) {
    const b = document.createElement('button');
    b.className = fokus === d.kunci ? 'aktif' : '';
    b.innerHTML = '<i class="warna ' + d.kelas + '"></i>' + esc(d.nama);
    b.addEventListener('click', function() {
      fokus = fokus === d.kunci ? '' : d.kunci;
      segarkan();
    });
    wadah.appendChild(b);
  });
}

function ukuranAwal() {
  const lebar = Math.min(window.innerWidth, 1280) - 64;
  const muat = Math.floor((lebar - 17 * 3) / 18);
  ukuran = Math.max(40, Math.min(64, muat));
}

function kulitElektron(konfig) {
  let k = [];
  konfig.split(' ').forEach(function(t) {
    const inti = /^\[(\w+)\]$/.exec(t);
    if (inti) { k = INTI[inti[1]].slice(); return; }
    const q = /^(\d)([spdf])(\d+)$/.exec(t);
    if (!q) return;
    const n = Number(q[1]);
    while (k.length < n) k.push(0);
    k[n - 1] += Number(q[3]);
  });
  return k;
}

function konfigTampil(konfig) {
  return konfig.split(' ').map(function(t) {
    const q = /^(\d[spdf])(\d+)$/.exec(t);
    return q ? esc(q[1]) + '<sup>' + q[2] + '</sup>' : esc(t);
  }).join(' ');
}

function gambarBohr(e) {
  const kulit = kulitElektron(e.konfig);
  let svg = '<svg viewBox="0 0 200 200" role="img" aria-label="Susunan elektron per kulit">';
  kulit.forEach(function(jumlah, i) {
    const r = kulit.length === 1 ? 38 : 30 + i * (66 / (kulit.length - 1));
    svg += '<circle class="orbit" cx="100" cy="100" r="' + r.toFixed(1) + '"/>';
    for (let j = 0; j < jumlah; j++) {
      const sudut = (j / jumlah) * Math.PI * 2 - Math.PI / 2 + i * 0.4;
      const x = 100 + r * Math.cos(sudut);
      const y = 100 + r * Math.sin(sudut);
      svg += '<circle class="elektron" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="2.4"/>';
    }
  });
  svg += '<circle class="inti" cx="100" cy="100" r="17"/><text x="100" y="100">' + esc(e.sim) + '</text></svg>';
  return svg;
}

function bukaDetail(z) {
  const e = DATA[z - 1];
  terpilih = z;
  const w = e.kat;
  const tampilWujud = WUJUD[wujudPada(e, 25)];
  const suhuTeks = function(n) { return n == null ? 'Tidak diketahui' : angkaId(n) + ' °C'; };
  const kulit = kulitElektron(e.konfig);
  let isi = '';
  isi += '<div class="lembar-atas"><button id="sebelumnya" aria-label="Sebelumnya"' + (z === 1 ? ' disabled' : '') + '>‹</button><span class="tengah">Unsur ke-' + z + ' dari 118</span><button id="tutup" aria-label="Tutup">×</button></div>';
  isi += '<div class="pembuka"><div class="besar warna k-' + w + '"><span class="no">' + e.z + '</span><span class="sim">' + esc(e.sim) + '</span><span class="ms">' + esc(e.massa) + '</span></div>';
  isi += '<div><h2>' + esc(e.nama) + '</h2><span class="kat warna k-' + w + '">' + esc(KATEGORI[w]) + '</span></div></div>';
  isi += '<div class="bohr">' + gambarBohr(e) + '</div>';
  isi += '<div class="rincian">';
  isi += '<div><small>Nomor atom</small><b>' + e.z + '</b></div>';
  isi += '<div><small>Massa atom relatif</small><b>' + esc(e.massa) + '</b></div>';
  isi += '<div><small>Periode</small><b>' + e.periode + '</b></div>';
  isi += '<div><small>Golongan</small><b>' + (e.golongan == null ? (e.kat === 'l' ? 'Lantanida' : 'Aktinida') : e.golongan) + '</b></div>';
  isi += '<div class="lebar"><small>Konfigurasi elektron</small><b>' + konfigTampil(e.konfig) + '</b></div>';
  isi += '<div class="lebar"><small>Elektron per kulit</small><b>' + kulit.join(', ') + '</b></div>';
  isi += '<div><small>Wujud (25 °C)</small><b>' + esc(tampilWujud) + '</b></div>';
  isi += '<div><small>Keelektronegatifan</small><b>' + (e.en == null ? 'Tidak ada data' : String(e.en).replace('.', ',')) + '</b></div>';
  isi += '<div><small>Titik leleh</small><b>' + suhuTeks(e.leleh) + '</b></div>';
  isi += '<div><small>' + (e.didih != null && e.leleh != null && e.didih < e.leleh ? 'Titik menyublim' : 'Titik didih') + '</small><b>' + suhuTeks(e.didih) + '</b></div>';
  if (e.guna) isi += '<div class="lebar"><small>Kegunaan</small><b>' + esc(e.guna) + '</b></div>';
  isi += '</div>';
  isi += '<div class="navigasi"><button id="sebelumnya2"' + (z === 1 ? ' disabled' : '') + '>‹ Sebelumnya</button><button id="berikutnya"' + (z === 118 ? ' disabled' : '') + '>Berikutnya ›</button></div>';
  $('lembar').innerHTML = isi;
  $('lapisan').classList.add('aktif');
  $('tutup').addEventListener('click', tutupDetail);
  $('sebelumnya').addEventListener('click', function() { if (terpilih > 1) bukaDetail(terpilih - 1); });
  $('sebelumnya2').addEventListener('click', function() { if (terpilih > 1) bukaDetail(terpilih - 1); });
  $('berikutnya').addEventListener('click', function() { if (terpilih < 118) bukaDetail(terpilih + 1); });
}

function tutupDetail() {
  $('lapisan').classList.remove('aktif');
  terpilih = 0;

function aturMode(m) {
  mode = m;

  });
  $('suhu').classList.toggle('tampil', m === 'wujud');
  segarkan();
}

  $('nilaiSuhu').textContent = angkaId(suhu) + ' °C';

function mulai() {
  ukuranAwal();
  bangunTabel();
  aturUkuran();
  segarkan();
  document.querySelectorAll('#mode button').forEach(function(b) {
    b.addEventListener('click', function() { aturMode(b.getAttribute('data-mode')); });
  });
  $('cari').addEventListener('input', function() {
    kata = this.value.trim();
    segarkan();
  });
  $('cari').addEventListener('keydown', function(e) {
    if (e.key !== 'Enter' || !kata) return;
    const hasil = DATA.filter(sudahCocok);
    if (hasil.length) { bukaDetail(hasil[0].z); this.blur(); }
  });
  $('kecilkan').addEventListener('click', function() { ukuran = Math.max(28, ukuran - 6); aturUkuran(); });
  $('besarkan').addEventListener('click', function() { ukuran = Math.min(90, ukuran + 6); aturUkuran(); });
  $('geserSuhu').addEventListener('input', function() { aturSuhu(this.value); });
  document.querySelectorAll('#suhu .cepat button').forEach(function(b) {
    b.addEventListener('click', function() { aturSuhu(b.getAttribute('data-suhu')); });
  });
  $('lapisan').addEventListener('click', function(e) {
    if (e.target === this) tutupDetail();
  });
  document.addEventListener('keydown', function(e) {
    if (!terpilih) return;
    if (e.key === 'Escape') tutupDetail();
    else if (e.key === 'ArrowLeft' && terpilih > 1) bukaDetail(terpilih - 1);
    else if (e.key === 'ArrowRight' && terpilih < 118) bukaDetail(terpilih + 1);
  });
}

mulai();
</script>
