<body>

<div class="app-container">

  <div class="header-brand">
    <div class="logo-mini">STools</div>
    <h1 id="namaKelasHeader" class="sk-pending">Memuat...</h1>
    <div class="sub-info"><span id="jumlahMuridHeader">- murid</span></div>
    <div class="live-badge">
      <span class="live-dot"></span> Live Update · <span id="lastUpdateText">Real-time</span>
    </div>
  </div>

  <div class="view-tabs">
    <button class="view-tab active" data-view="harian" onclick="switchView('harian')">Per Hari</button>
    <button class="view-tab" data-view="rekap" onclick="switchView('rekap')">Rekap Bulanan</button>
  </div>

  <div class="main-card">
    <div class="filter-row">
      <select class="select-box" id="pilihBulanView" onchange="gantiBulan(this.value)"></select>
      <select class="select-box" id="pilihTanggalView" onchange="gantiTanggal(this.value)"></select>
      <input class="search-input" id="searchInput" placeholder="Cari nama murid..." oninput="filterMurid(this.value)">
    </div>

    <div class="stats-bar" id="statsBar">
      <div class="stat-card"><div class="num hadir" id="statHadir">0</div><div class="label">Hadir</div></div>
      <div class="stat-card"><div class="num izin" id="statIzin">0</div><div class="label">Izin</div></div>
      <div class="stat-card"><div class="num sakit" id="statSakit">0</div><div class="label">Sakit</div></div>
      <div class="stat-card"><div class="num alpa" id="statAlpa">0</div><div class="label">Alpa</div></div>
      <div class="stat-card"><div class="num belum" id="statBelum">0</div><div class="label">Belum</div></div>
    </div>

    <div class="list-wrap" id="harianViewWrap">
      <table class="harian-table" id="harianTable">
        <thead>
          <tr>
            <th>Nama</th>
            <th class="col-status">Status</th>
          </tr>
        </thead>
        <tbody id="harianView">
          <tr class="sk-tr"><td><span class="sk-block" style="height:16px;width:60%"></span></td><td class="col-status"><span class="sk-block" style="height:24px;width:70px;border-radius:30px;margin-left:auto"></span></td></tr><tr class="sk-tr"><td><span class="sk-block" style="height:16px;width:60%"></span></td><td class="col-status"><span class="sk-block" style="height:24px;width:70px;border-radius:30px;margin-left:auto"></span></td></tr><tr class="sk-tr"><td><span class="sk-block" style="height:16px;width:60%"></span></td><td class="col-status"><span class="sk-block" style="height:24px;width:70px;border-radius:30px;margin-left:auto"></span></td></tr><tr class="sk-tr"><td><span class="sk-block" style="height:16px;width:60%"></span></td><td class="col-status"><span class="sk-block" style="height:24px;width:70px;border-radius:30px;margin-left:auto"></span></td></tr><tr class="sk-tr"><td><span class="sk-block" style="height:16px;width:60%"></span></td><td class="col-status"><span class="sk-block" style="height:24px;width:70px;border-radius:30px;margin-left:auto"></span></td></tr><tr class="sk-tr"><td><span class="sk-block" style="height:16px;width:60%"></span></td><td class="col-status"><span class="sk-block" style="height:24px;width:70px;border-radius:30px;margin-left:auto"></span></td></tr>
        </tbody>
      </table>
    </div>

<div class="table-wrap" id="rekapView" style="display:none;">
  <div style="overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px;">
    <table class="rekap-table" id="rekapTable" style="min-width: 500px; width: 100%;">
      <thead>
        <tr>
          <th class="rekap-nama" style="min-width: 140px;">Nama</th>
          <th style="min-width: 60px;">Hadir</th>
          <th style="min-width: 60px;">Izin</th>
          <th style="min-width: 60px;">Sakit</th>
          <th style="min-width: 60px;">Alpa</th>
        </tr>
      </thead>
      <tbody id="rekapTableBody"></tbody>
    </table>
  </div>
</div>

    <div class="btn-group">
      <button class="btn btn-primary" onclick="exportPDF()">Export PDF</button>
      <button class="btn btn-primary" onclick="exportCSV()">Export Excel</button>
    </div>
  </div>

  <div class="footer-note">
    Halaman ini untuk melihat data absensi. Data otomatis terupdate secara real-time.<br>
    Star Platform &middot; STools 2026
  </div>
</div>

<div id="modalOverlay" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-icon">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </div>
    <h3 id="modalTitle">Perhatian</h3>
    <p id="modalMessage">Pesan</p>
    <button class="btn-modal" onclick="closeModal()">Mengerti</button>
  </div>
</div>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyDgr_nHqvpMsiG4lBkYckzxRErkskXj_6E",
  authDomain: "laporanstartools-c18b2.firebaseapp.com",
  databaseURL: "https://laporanstartools-c18b2-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "laporanstartools-c18b2",
};
if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
var db = firebase.database();

function getParam(key) {
  return new URLSearchParams(window.location.search).get(key);
}

var kelasId = getParam("kelas");
var namaKelasAktif = "";
var BULAN_LIST = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
var bulanDipilih = new Date().toLocaleString("id-ID", { month: "long" });
var tanggalDipilih = new Date().getDate();
var daftarMuridAktif = [];
var searchQuery = "";
var viewMode = "harian";
var harianListeners = {};
var rekapListeners = {};

function showAlertModal(title, message) {
  document.getElementById("modalTitle").innerText = title || "Perhatian";
  document.getElementById("modalMessage").innerText = message || "";
  document.getElementById("modalOverlay").classList.add("active");
}
function closeModal() {
  document.getElementById("modalOverlay").classList.remove("active");
}

function daysInMonth(namaBulan) {
  var idx = BULAN_LIST.indexOf(namaBulan);
  var now = new Date();
  return new Date(now.getFullYear(), idx + 1, 0).getDate();
}

function isWeekend(bulan, tgl) {
  var idx = BULAN_LIST.indexOf(bulan);
  var year = new Date().getFullYear();
  var d = new Date(year, idx, tgl);
  var day = d.getDay();
  return day === 0 || day === 6;
}

function skDone(ids) { document.querySelectorAll('#namaKelasHeader.sk-pending').forEach(function (e) { e.classList.remove('sk-pending'); e.classList.add('sk-reveal'); }); }
setTimeout(skDone, 8000);

function renderError(msg) {
  skDone();
  document.getElementById("namaKelasHeader").innerText = "Tidak Ditemukan";
  document.getElementById("jumlahMuridHeader").innerText = "- murid";
  document.getElementById("statsBar").style.display = "none";
  document.getElementById("harianView").innerHTML = "";
  document.querySelector(".view-tabs").style.display = "none";
  document.querySelector(".btn-group").style.display = "none";
  showAlertModal("Link Tidak Valid", msg || "Pastikan link yang dibuka lengkap dan benar.");
}

function renderBulanOptions() {
  var select = document.getElementById("pilihBulanView");
  select.innerHTML = '';
  BULAN_LIST.forEach(function(b) {
    var opt = document.createElement('option');
    opt.value = b;
    opt.textContent = b;
    if (b === bulanDipilih) opt.selected = true;
    select.appendChild(opt);
  });
}

function renderTanggalOptions() {
  var select = document.getElementById("pilihTanggalView");
  var total = daysInMonth(bulanDipilih);
  if (tanggalDipilih > total) tanggalDipilih = total;
  select.innerHTML = '';
  for (var i = 1; i <= total; i++) {
    var opt = document.createElement('option');
    opt.value = i;
    opt.textContent = 'Tanggal ' + i + (isWeekend(bulanDipilih, i) ? ' (Libur)' : '');
    if (i === tanggalDipilih) opt.selected = true;
    select.appendChild(opt);
  }
}

function filterMurid(query) {
  searchQuery = query.toLowerCase().trim();
  if (viewMode === 'harian') loadHarianView(); else loadRekapView();
}

function getFilteredMurid() {
  if (!searchQuery) return daftarMuridAktif;
  return daftarMuridAktif.filter(function(nama) {
    return nama.toLowerCase().includes(searchQuery);
  });
}

function gantiBulan(bulan) {
  bulanDipilih = bulan;
  renderTanggalOptions();
  if (viewMode === 'harian') loadHarianView(); else loadRekapView();
}

function gantiTanggal(tgl) {
  tanggalDipilih = parseInt(tgl, 10);
  loadHarianView();
}

function switchView(mode) {
  viewMode = mode;
  document.querySelectorAll('.view-tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelector('.view-tab[data-view="' + mode + '"]').classList.add('active');
  document.getElementById('harianViewWrap').style.display = mode === 'harian' ? 'block' : 'none';
  document.getElementById('rekapView').style.display = mode === 'rekap' ? 'block' : 'none';
  document.getElementById('pilihTanggalView').style.display = mode === 'harian' ? 'block' : 'none';
  document.getElementById('statsBar').style.display = mode === 'harian' ? 'grid' : 'none';
  if (mode === 'harian') loadHarianView(); else loadRekapView();
}

function loadHarianView() {
  var container = document.getElementById("harianView");
  var filtered = getFilteredMurid();

  Object.keys(harianListeners).forEach(function(nama) {
    if (harianListeners[nama]) harianListeners[nama].off();
  });
  harianListeners = {};

  if (filtered.length === 0) {
    container.innerHTML = '<tr><td colspan="2" class="empty-state">' +
      (daftarMuridAktif.length === 0 ? 'Belum ada murid di kelas ini.' : 'Tidak ada murid yang cocok dengan pencarian.') +
      '</td></tr>';
    updateStatsHarian();
    return;
  }

  var html = '';
  filtered.forEach(function(nama) {
    var safe = nama.replace(/[^a-zA-Z0-9]/g, "_");
    html += '<tr id="hrow-' + safe + '">' +
      '<td class="murid-name">' + nama + '</td>' +
      '<td class="col-status"><span class="murid-status-badge belum sk-pending" id="hstatus-' + safe + '">Memuat...</span></td>' +
      '</tr>';
  });
  container.innerHTML = html;

  filtered.forEach(function(nama) {
    var safe = nama.replace(/[^a-zA-Z0-9]/g, "_");
    var ref = db.ref("kelas/" + kelasId + "/siswa/" + nama + "/absen/" + bulanDipilih + "/" + tanggalDipilih);
    harianListeners[nama] = ref;
    ref.on("value", function(snap) {
      var rec = snap.val();
      var status = rec ? rec.status : null;
      var badge = document.getElementById("hstatus-" + safe);
      if (!badge) return;
      if (status === "Hadir") { badge.className = "murid-status-badge hadir"; badge.innerText = "Hadir"; }
      else if (status === "Izin") { badge.className = "murid-status-badge izin"; badge.innerText = "Izin"; }
      else if (status === "Sakit") { badge.className = "murid-status-badge sakit"; badge.innerText = "Sakit"; }
      else if (status === "Alpa") { badge.className = "murid-status-badge alpa"; badge.innerText = "Alpa"; }
      else if (isWeekend(bulanDipilih, tanggalDipilih)) { badge.className = "murid-status-badge libur"; badge.innerText = "Libur"; }
      else { badge.className = "murid-status-badge belum"; badge.innerText = "Belum"; }
      updateStatsHarian();
    });
  });

  updateStatsHarian();
  updateLastUpdate();
}

function updateStatsHarian() {
  var filtered = getFilteredMurid();
  var stats = { Hadir: 0, Izin: 0, Sakit: 0, Alpa: 0, Belum: 0 };
  filtered.forEach(function(nama) {
    var safe = nama.replace(/[^a-zA-Z0-9]/g, "_");
    var badge = document.getElementById("hstatus-" + safe);
    if (!badge) return;
    var text = badge.innerText;
    if (text === "Hadir") stats.Hadir++;
    else if (text === "Izin") stats.Izin++;
    else if (text === "Sakit") stats.Sakit++;
    else if (text === "Alpa") stats.Alpa++;
    else if (text !== "Memuat...") stats.Belum++;
  });
  document.getElementById("statHadir").innerText = stats.Hadir;
  document.getElementById("statIzin").innerText = stats.Izin;
  document.getElementById("statSakit").innerText = stats.Sakit;
  document.getElementById("statAlpa").innerText = stats.Alpa;
  document.getElementById("statBelum").innerText = stats.Belum;
}

function loadRekapView() {
  var tbody = document.getElementById("rekapTableBody");
  var filtered = getFilteredMurid();

  Object.keys(rekapListeners).forEach(function(nama) {
    if (rekapListeners[nama]) rekapListeners[nama].off();
  });
  rekapListeners = {};

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-state">' +
      (daftarMuridAktif.length === 0 ? 'Belum ada murid di kelas ini.' : 'Tidak ada murid yang cocok dengan pencarian.') +
      '</td></tr>';
    return;
  }

  var html = '';
  filtered.forEach(function(nama) {
    var safe = nama.replace(/[^a-zA-Z0-9]/g, "_");
    html += '<tr>' +
      '<td class="rekap-nama">' + nama + '</td>' +
      '<td class="rekap-hadir" id="rHadir-' + safe + '">0</td>' +
      '<td class="rekap-izin" id="rIzin-' + safe + '">0</td>' +
      '<td class="rekap-sakit" id="rSakit-' + safe + '">0</td>' +
      '<td class="rekap-alpa" id="rAlpa-' + safe + '">0</td>' +
      '</tr>';
  });
  tbody.innerHTML = html;

  filtered.forEach(function(nama) {
    var safe = nama.replace(/[^a-zA-Z0-9]/g, "_");
    var ref = db.ref("kelas/" + kelasId + "/siswa/" + nama + "/absen/" + bulanDipilih);
    rekapListeners[nama] = ref;
    ref.on("value", function(snap) {
      var data = snap.val() || {};
      var count = { Hadir: 0, Izin: 0, Sakit: 0, Alpa: 0 };
      Object.keys(data).forEach(function(tgl) {
        var status = data[tgl] ? data[tgl].status : null;
        if (count.hasOwnProperty(status)) count[status]++;
      });
      var elH = document.getElementById("rHadir-" + safe);
      var elI = document.getElementById("rIzin-" + safe);
      var elS = document.getElementById("rSakit-" + safe);
      var elA = document.getElementById("rAlpa-" + safe);
      if (elH) elH.innerText = count.Hadir;
      if (elI) elI.innerText = count.Izin;
      if (elS) elS.innerText = count.Sakit;
      if (elA) elA.innerText = count.Alpa;
    });
  });

  updateLastUpdate();
}

function updateLastUpdate() {
  var now = new Date();
  var jam = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  document.getElementById("lastUpdateText").innerText = jam;
}

function getExportRows() {
  var filtered = getFilteredMurid();
  if (viewMode === 'harian') {
    return {
      head: [["Nama", "Status"]],
      body: filtered.map(function(nama) {
        var safe = nama.replace(/[^a-zA-Z0-9]/g, "_");
        var badge = document.getElementById("hstatus-" + safe);
        return [nama, badge ? badge.innerText : "-"];
      }),
      title: "Absensi " + namaKelasAktif + " — " + bulanDipilih + " Tgl " + tanggalDipilih,
      filename: "Absensi-" + namaKelasAktif.replace(/\s+/g, "_") + "-" + bulanDipilih + "-" + tanggalDipilih
    };
  }
  return {
    head: [["Nama", "Hadir", "Izin", "Sakit", "Alpa"]],
    body: filtered.map(function(nama) {
      var safe = nama.replace(/[^a-zA-Z0-9]/g, "_");
      var g = function(id) { var el = document.getElementById(id); return el ? el.innerText : "0"; };
      return [nama, g("rHadir-" + safe), g("rIzin-" + safe), g("rSakit-" + safe), g("rAlpa-" + safe)];
    }),
    title: "Rekap Bulanan " + namaKelasAktif + " — " + bulanDipilih,
    filename: "Rekap-" + namaKelasAktif.replace(/\s+/g, "_") + "-" + bulanDipilih
  };
}

function exportPDF() {
  var jsPDFLib = window.jspdf && window.jspdf.jsPDF;
  if (!jsPDFLib) { showAlertModal("Library Error", "Library PDF belum siap, coba lagi sebentar."); return; }
  var data = getExportRows();
  var doc = new jsPDFLib({ orientation: "portrait", unit: "mm", format: "a4" });
  doc.setFontSize(15);
  doc.setTextColor(37, 99, 235);
  doc.text(data.title, 14, 16);
  doc.setFontSize(9);
  doc.setTextColor(100, 116, 139);
  doc.text("Diexport: " + new Date().toLocaleString("id-ID"), 14, 22);
  doc.autoTable({
    startY: 28,
    head: data.head,
    body: data.body,
    styles: { fontSize: 9, halign: "center", cellPadding: 3 },
    columnStyles: { 0: { halign: "left", fontStyle: "bold" } },
    headStyles: { fillColor: [37, 99, 235] }
  });
  doc.save(data.filename + ".pdf");
  showAlertModal("Berhasil!", "PDF berhasil diunduh.");
}

function exportCSV() {
  var data = getExportRows();
  var csv = "\uFEFF" + data.title + "\nDiexport: " + new Date().toLocaleString("id-ID") + "\n\n";
  csv += data.head[0].join(",") + "\n";
  data.body.forEach(function(row) {
    csv += '"' + row[0] + '"' + "," + row.slice(1).join(",") + "\n";
  });
  var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  var link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = data.filename + ".csv";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  showAlertModal("Berhasil!", "CSV berhasil diunduh.");
}

window.addEventListener("DOMContentLoaded", function() {
  if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark');
  }

  if (!kelasId) {
    renderError("Link tidak valid. Pastikan link yang dibuka lengkap dan benar.");
    return;
  }

  db.ref("kelas/" + kelasId).once("value").then(function(snap) {
    if (!snap.exists()) {
      renderError("Kelas tidak ditemukan. ID Kelas tidak terdaftar di database.");
      return;
    }
    var kelasData = snap.val();
    namaKelasAktif = kelasData.nama || "Kelas";
    daftarMuridAktif = kelasData.siswa ? Object.keys(kelasData.siswa) : [];

    skDone();
    document.getElementById("namaKelasHeader").innerText = namaKelasAktif;
    document.getElementById("jumlahMuridHeader").innerHTML = daftarMuridAktif.length + " murid";

    renderBulanOptions();
    renderTanggalOptions();
    loadHarianView();
  }).catch(function(err) {
    renderError("Gagal memuat data. Periksa koneksi internet.");
  });
});
</script>
<script src="telepon.js"></script>
<script src="translate.js"></script>
</body>
</html>
