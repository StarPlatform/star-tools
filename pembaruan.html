    #pageList, #pageList.hidden { display: block !important; grid-column: 1; min-width: 0; }

  /* ===== Skeleton Shimmer ===== */
  :root { --sk-base: #E2E8F0; --sk-hi: #F8FAFC; }
  body.dark { --sk-base: #1E293B; --sk-hi: #334155; }
  @keyframes skShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .sk-pending { color: transparent !important; text-shadow: none !important; background: linear-gradient(90deg, var(--sk-base) 25%, var(--sk-hi) 50%, var(--sk-base) 75%) !important; background-size: 200% 100% !important; animation: skShimmer 1.4s ease-in-out infinite; pointer-events: none; user-select: none; border-color: transparent !important; }
  .sk-pending * { visibility: hidden; }
  .sk-block { display: block; border-radius: 10px; background: linear-gradient(90deg, var(--sk-base) 25%, var(--sk-hi) 50%, var(--sk-base) 75%); background-size: 200% 100%; animation: skShimmer 1.4s ease-in-out infinite; }
  .sk-row { height: 58px; border-radius: 14px; margin-bottom: 10px; }
  .sk-table { display: flex; flex-direction: column; gap: 8px; padding: 6px 0; }
  .sk-line { display: flex; gap: 8px; align-items: center; }
  .sk-line .sk-block { height: 22px; flex: 1; }
  .sk-line .sk-block.sk-name { flex: 0 0 34%; }
  .sk-line.sk-head .sk-block { height: 26px; opacity: .8; }
  @media (prefers-reduced-motion: reduce) { .sk-pending, .sk-block { animation: none !important; } }
/* ===== Skeleton Shimmer+ (animasi tambahan) ===== */
  :root { --sk-hi: #FFFFFF; }
  body.dark { --sk-hi: #475569; }
  @keyframes skPulse { 0%, 100% { opacity: 1; } 50% { opacity: .6; } }
  @keyframes skReveal { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
  @keyframes skPop { 0% { opacity: 0; transform: scale(.9); } 60% { opacity: 1; transform: scale(1.04); } 100% { opacity: 1; transform: scale(1); } }
  .sk-pending, .sk-block { background-image: linear-gradient(100deg, var(--sk-base) 30%, var(--sk-hi) 50%, var(--sk-base) 70%) !important; background-size: 250% 100% !important; animation: skShimmer 1.1s linear infinite, skPulse 1.8s ease-in-out infinite; }
  .sk-reveal { animation: skPop .5s cubic-bezier(.2,.8,.2,1) both; }
  .sk-first > :not(.sk-block) { animation: skReveal .5s cubic-bezier(.2,.8,.2,1) both; }
  .sk-was .table-wrap, .sk-was > p { animation: skReveal .5s cubic-bezier(.2,.8,.2,1) both; }
  .grid-bagian > .sk-block:nth-child(2), .sk-table .sk-line:nth-child(2) .sk-block, #loadingState > :nth-child(2), #skIsi > :nth-child(2), #daftarGuruList > .sk-block:nth-child(2) { animation-delay: 0.12s, 0.12s; }

  .grid-bagian > .sk-block:nth-child(4), .sk-table .sk-line:nth-child(4) .sk-block, #loadingState > :nth-child(4), #skIsi > :nth-child(4), #daftarGuruList > .sk-block:nth-child(4) { animation-delay: 0.36s, 0.36s; }
  .grid-bagian > .sk-block:nth-child(5), .sk-table .sk-line:nth-child(5) .sk-block, #loadingState > :nth-child(5), #skIsi > :nth-child(5), #daftarGuruList > .sk-block:nth-child(5) { animation-delay: 0.48s, 0.48s; }
  .grid-bagian > .sk-block:nth-child(6), .sk-table .sk-line:nth-child(6) .sk-block, #loadingState > :nth-child(6), #skIsi > :nth-child(6), #daftarGuruList > .sk-block:nth-child(6) { animation-delay: 0.6s, 0.6s; }
  .grid-bagian > .sk-block:nth-child(7), .sk-table .sk-line:nth-child(7) .sk-block, #loadingState > :nth-child(7), #skIsi > :nth-child(7), #daftarGuruList > .sk-block:nth-child(7) { animation-delay: 0.72s, 0.72s; }
  .grid-bagian > .sk-block:nth-child(8), .sk-table .sk-line:nth-child(8) .sk-block, #loadingState > :nth-child(8), #skIsi > :nth-child(8), #daftarGuruList > .sk-block:nth-child(8) { animation-delay: 0.84s, 0.84s; }

    <div class="logout-link">
      <a href="#" onclick="firebase.auth().signOut().then(function(){window.location.href='login.html'}); return false;">
        <svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Keluar
      </a>
    </div>
  </div>

  <div class="screen">

    <div id="pageList" class="page-list">
      <div class="card-modern">
        <h2>Notifikasi Pembaruan</h2>
        <p class="subtext">Semua update terbaru dari STools akan muncul di sini.</p>
        <div id="notificationList" aria-busy="true"><span class="sk-block sk-row"></span><span class="sk-block sk-row"></span><span class="sk-block sk-row"></span></div>
      </div>
    </div>

    <div id="pageDetail" class="page-detail">
      <div class="card-modern">
        <div class="detail-back-btn" onclick="backToList()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          <span>Kembali ke daftar</span>
        </div>
        <div class="detail-title" id="detailTitle">Judul Notifikasi</div>
        <span class="detail-time" id="detailTime">Baru saja</span>
        <div class="detail-body" id="detailBody">
          <p>Isi lengkap notifikasi akan tampil di sini.</p>
        </div>
      </div>
    </div>

  </div>

  <div class="footer-app">
    <p>Star Platform | STools 2026</p>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDgr_nHqvpMsiG4lBkYckzxRErkskXj_6E",
  authDomain: "laporanstartools-c18b2.firebaseapp.com",
  databaseURL: "https://laporanstartools-c18b2-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "laporanstartools-c18b2",
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

let allNotifications = {};
let selectedKey = null;

function goTo(page) {
  window.location.href = page;
}

function formatWaktu(timestamp) {
  const d = new Date(timestamp);
  const now = new Date();
  const diff = now - d;

  if (diff < 60000) return 'Baru saja';
  if (diff < 3600000) return Math.floor(diff / 60000) + ' menit lalu';
  if (diff < 86400000) return Math.floor(diff / 3600000) + ' jam lalu';
  if (diff < 172800000) return 'Kemarin';
  return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
}

function formatWaktuFull(timestamp) {
  const d = new Date(timestamp);
  return d.toLocaleDateString('id-ID', {
    day: 'numeric',
    month: 'long',
    year: 'numeric',
    hour: '2-digit',
    minute: '2-digit'
  });
}

function truncateText(text, maxLength) {
  if (text.length <= maxLength) return text;
  return text.substring(0, maxLength) + '...';
}

function loadNotifications() {
  const list = document.getElementById('notificationList');

  db.ref('notifications').orderByChild('timestamp').once('value').then(function(snap) {
    const data = snap.val() || {};
    allNotifications = data;
    const keys = Object.keys(data).sort((a, b) => (data[b].timestamp || 0) - (data[a].timestamp || 0));
    const readIds = JSON.parse(localStorage.getItem('readNotifications') || '[]');

    if (keys.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <h3>Belum ada notifikasi</h3>
          <p>Notifikasi pembaruan akan muncul di sini.</p>
        </div>
      `;
      return;
    }

    let html = '';
    keys.forEach(function(key) {
      const notif = data[key];
      const isRead = readIds.includes(key);
      const desc = notif.pesan || '';
      const shortDesc = truncateText(desc, 80);

      html += `
        <div class="notification-item ${isRead ? '' : 'unread'}${key === selectedKey && document.getElementById('pageDetail').classList.contains('active') ? ' selected' : ''}" onclick="openDetail('${key}')">
          ${!isRead ? '<span class="badge-unread"></span>' : ''}
          <div class="title">${notif.judul || 'Pembaruan'}</div>
          <div class="desc">${shortDesc}</div>
          <span class="time">${formatWaktu(notif.timestamp || Date.now())}</span>
          ${desc.length > 80 ? '<span class="read-more">Baca selengkapnya</span>' : ''}
        </div>
      `;
    });
    list.innerHTML = html;
  });
}

function openDetail(key) {
  selectedKey = key;
  const notif = allNotifications[key];
  if (!notif) return;

  markAsRead(key);

  document.getElementById('detailTitle').innerText = notif.judul || 'Pembaruan';
  document.getElementById('detailTime').innerText = formatWaktuFull(notif.timestamp || Date.now());

  const body = notif.pesan || 'Tidak ada isi pesan.';
  document.getElementById('detailBody').innerHTML = body.replace(/\n/g, '<br>');

  document.getElementById('pageList').classList.add('hidden');
  document.getElementById('pageDetail').classList.add('active');

  if (window.matchMedia('(min-width: 900px)').matches) {
    loadNotifications();
    updateBadgeCount();
  }

  window.scrollTo(0, 0);
}

function backToList() {
  document.getElementById('pageList').classList.remove('hidden');
  document.getElementById('pageDetail').classList.remove('active');

  loadNotifications();
  updateBadgeCount();
}

function markAsRead(key) {
  const readIds = JSON.parse(localStorage.getItem('readNotifications') || '[]');
  if (!readIds.includes(key)) {
    readIds.push(key);
    localStorage.setItem('readNotifications', JSON.stringify(readIds));
    updateBadgeCount();
  }
}

function markAllRead() {
  const keys = Object.keys(allNotifications);
  if (keys.length === 0) return;

  const readIds = JSON.parse(localStorage.getItem('readNotifications') || '[]');
  keys.forEach(function(key) {
    if (!readIds.includes(key)) {
      readIds.push(key);
    }
  });
  localStorage.setItem('readNotifications', JSON.stringify(readIds));

  loadNotifications();
  updateBadgeCount();
}

function updateBadgeCount() {
  const readIds = JSON.parse(localStorage.getItem('readNotifications') || '[]');
  const count = Object.keys(allNotifications).filter(function(key) {
    return !readIds.includes(key);
  }).length;
  localStorage.setItem('unreadCount', count);
}

if (localStorage.getItem('theme') === 'dark') {
  document.body.classList.add('dark');
}

const currentPage = window.location.pathname.split('/').pop() || 'pembaruan.html';
document.querySelectorAll('.nav-item').forEach(item => {
  item.classList.toggle('active', item.dataset.page === currentPage);
});

document.addEventListener('DOMContentLoaded', function() {
  loadNotifications();

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if (id && allNotifications[id]) {
    setTimeout(function() {
      openDetail(id);
    }, 300);
  }
});
</script>

<script src="telepon.js"></script>
<script src="translate.js"></script>
</body>
</html>
